[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(name)s] %(message)s
log_cli_date_format = %H:%M:%S



markers =
    smoke: critical tests, run on every build
    regression: full regression suite
    e2e: end-to-end scenarios across services
    known_bug: tests that fail due to a known product bug
