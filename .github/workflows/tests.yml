name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Test marker to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - e2e
          - known_bug

permissions:
  contents: write
  pages: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Set up Docker Buildx ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Cache Docker layers ----------
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements.txt', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ---------- Build Docker image ----------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shop-api-tests:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ---------- Move cache ----------
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ---------- Cache Allure history ----------
      - name: Cache Allure history
        uses: actions/cache@v4
        with:
          path: allure-results/history
          key: allure-history-${{ github.ref_name }}-${{ inputs.marker || 'smoke' }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-${{ inputs.marker || 'smoke' }}-
            allure-history-${{ github.ref_name }}-
            allure-history-

      # ---------- Run tests in Docker ----------
      - name: Run tests in Docker
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MARKER: ${{ inputs.marker || 'smoke' }}
        run: |
          echo "▶ Marker: $MARKER"
          mkdir -p allure-results
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BASE_URL="$BASE_URL" \
            -e API_TOKEN="$API_TOKEN" \
            -e ALLURE_DIR=allure-results \
            -v "$(pwd)/allure-results:/app/allure-results" \
            shop-api-tests:latest \
            pytest -m "$MARKER" --alluredir=allure-results

      # ---------- Install Allure CLI ----------
      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      # ---------- Generate Allure report ----------
      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      # ---------- Copy history back ----------
      - name: Copy history back for next run
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r allure-report/history/* allure-results/history/ || true

      # ---------- Upload Allure report ----------
      - name: Upload Allure report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.marker || 'smoke' }}
          path: allure-report
          retention-days: 30

      # ---------- Add report link to Summary ----------
      - name: Add report link to summary
        if: always()
        env:
          MARKER: ${{ inputs.marker || 'smoke' }}
        run: |
          if [ "$MARKER" = "smoke" ]; then
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$MARKER/"
          fi
          echo "## 🔗 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Marker:** \`$MARKER\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** [$URL]($URL)" >> $GITHUB_STEP_SUMMARY

      # ---------- Deploy smoke to Pages root ----------
      - name: Deploy smoke to Pages root
        if: always() && github.ref == 'refs/heads/main' && (inputs.marker || 'smoke') == 'smoke'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

      # ---------- Deploy marker to Pages subfolder ----------
      - name: Deploy marker to Pages subfolder
        if: always() && github.ref == 'refs/heads/main' && (inputs.marker || 'smoke') != 'smoke'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: ${{ inputs.marker || 'smoke' }}
          keep_files: true